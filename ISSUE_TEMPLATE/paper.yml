name: Suggest a paper or project
description: Add a source-backed executable-world research contribution
title: '[Paper] '
body:
  - type: input
    id: title
    attributes:
      label: Exact title
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Primary source URL
      description: arXiv, publisher or official project
    validations:
      required: true
  - type: textarea
    id: contribution
    attributes:
      label: What role does code play?
      description: Explain the main research question, dynamics authority and suggested category.
    validations:
      required: true
  - type: textarea
    id: resources
    attributes:
      label: Additional resources and evidence
      description: Separate paper, code, project, data and weights. Include source passages supporting classification.
