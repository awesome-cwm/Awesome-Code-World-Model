name: Validate collection
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/build.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check site/app.js
      - run: node --check site/theme.js
      - run: node --test tests/home.test.cjs
