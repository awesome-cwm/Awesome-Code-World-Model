<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
  <g transform="translate(158 318)" color="#5972d7"><use href="#node"/><use href="#cube"/><text y="52" fill="#263c70" font-size="19">Scene programs</text></g>
