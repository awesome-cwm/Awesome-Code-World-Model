  <text x="95" y="501" font-size="14" letter-spacing="2" fill="#626bd0">01 / GENERATION</text>
  <text x="95" y="539" font-size="25" font-weight="700" fill="#273e74">Code builds worlds</text>
  <text x="95" y="575" font-size="19" fill="#657697">Intent → program → interaction</text>
  <rect x="988" y="468" width="382" height="139" rx="16" fill="#fff" stroke="#cce6e5"/>
