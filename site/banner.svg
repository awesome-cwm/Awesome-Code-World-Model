  <text x="1013" y="539" font-size="25" font-weight="700" fill="#273e74">Code explains worlds</text>
  <text x="1013" y="575" font-size="19" fill="#657697">Observe → infer → test</text>
  <rect x="569" y="469" width="302" height="102" rx="14" fill="#23375e"/>
