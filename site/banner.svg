<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660" role="img" aria-labelledby="title desc">
<title id="title">Awesome Code World Model — an executable world research map</title>
<desc id="desc">Scene programs, physical simulation, neural rendering, persistent worlds, reconstruction, reasoning, planning and verification surround a shared executable world. Generation builds a world from intent; understanding infers a program from observations.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f5f7ff"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#eaf9f6"/></linearGradient>
  <linearGradient id="ink"><stop stop-color="#5155d9"/><stop offset=".55" stop-color="#3878b9"/><stop offset="1" stop-color="#1ba698"/></linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e6f3ff"/><stop offset="1" stop-color="#8493ec"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#d6e8ff" stop-opacity=".65"/><stop offset="1" stop-color="#edf4ff" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#c6d3eb" opacity=".4"/></pattern>
  <clipPath id="globe"><ellipse cx="720" cy="552" rx="296" ry="175"/></clipPath>
  <g id="node"><circle r="29" fill="#fff" stroke="#d4dcf3" stroke-width="2"/><circle r="23" fill="currentColor" opacity=".1"/></g>
  <g id="cube" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><path d="m0-15 14 8v16L0 17-14 9V-7Z M-14-7 0 1 14-7M0 1v16"/></g>
</defs>
