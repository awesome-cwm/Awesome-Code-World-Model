  <text x="720" y="217" font-size="16" letter-spacing="5" fill="#6979a0">A MAP OF EXECUTABLE INTELLIGENCE</text>
  <text x="720" y="284" font-size="65" font-weight="700" fill="#16274f">Awesome</text>
  <text x="720" y="359" font-size="72" font-weight="700" fill="url(#ink)">Code World Model</text>
  <text x="720" y="401" font-size="24" fill="#687fa5">Build a world. Infer a program. Test what follows.</text>
