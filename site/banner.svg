  <g transform="translate(480 91)" color="#5a73d7"><use href="#node"/><rect x="-16" y="-11" width="32" height="23" rx="3" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="m-5-6 12 7-12 7Z" fill="currentColor"/><text y="52" fill="#263c70" font-size="19">Code-guided rendering</text></g>
  <g transform="translate(720 66)" color="#329aa1"><use href="#node"/><path d="M-13 10V-9H13V10M-17 1H17M-5-15V16M5-15V16" fill="none" stroke="currentColor" stroke-width="2"/><text y="52" fill="#263c70" font-size="19">Persistent worlds</text></g>
  <g transform="translate(960 91)" color="#329aa1"><use href="#node"/><use href="#cube"/><path d="M-20 0a20 20 0 0 1 27-19M7-23v7h7" fill="none" stroke="currentColor" stroke-width="2"/><text y="52" fill="#263c70" font-size="19">Inverse reconstruction</text></g>
  <g transform="translate(1166 170)" color="#4e83be"><use href="#node"/><path d="m-17-1 9-7 8 12 15-17M-17 15h34" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="0" cy="4" r="3" fill="currentColor"/><text y="52" fill="#263c70" font-size="19">Reasoning &amp; planning</text></g>
